[package]
name = "orpheus-statescript"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Portable StateScript graph loader, expression evaluator, and VM for ORPHEUS"

[lints]
workspace = true

[features]
node-observations = []

[dependencies]
flate2 = "1.1"
indexmap = { version = "2", features = ["serde"] }
orpheus-runtime = { path = "../runtime" }
orpheus-wire = { path = "../wire" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
sha2 = "0.10"
