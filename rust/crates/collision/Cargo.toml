[package]
name = "orpheus-collision"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Static geometry queries and character contact solver for ORPHEUS"

[dependencies]
lzma-rust2 = { version = "0.25", default-features = false, features = ["std", "xz"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
sha2 = "0.10"
