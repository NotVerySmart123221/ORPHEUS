name: Python archive PR policy

on:
  schedule:
    - cron: '8,23,38,53 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  enforce:
    if: >-
      github.repository == 'leafall903/ORPHEUS' &&
      github.ref == 'refs/heads/main' &&
      github.event.repository.default_branch == 'main' &&
      vars.PYTHON_ARCHIVE_GUARD_SINCE != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pull-requests: write
    concurrency:
      group: python-archive-policy
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      SINCE: ${{ vars.PYTHON_ARCHIVE_GUARD_SINCE }}
    steps:
      - name: Close new pull requests targeting the read-only archive
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SINCE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$ ]]
          [[ "$SINCE" < "2026-11-19T12:00:00Z" ]] && exit 1
          [[ "$(date -u +%FT%TZ)" < "$SINCE" ]] && exit 0
          pulls=$(gh api --paginate --slurp "repos/$REPO/pulls?state=open&base=python-archive&per_page=100")
          numbers=$(jq -r '.[][] | .number' <<< "$pulls")
          for pr in $numbers; do
            created=$(jq -r --argjson pr "$pr" '.[][] | select(.number == $pr) | .created_at' <<< "$pulls")
            if [[ "$created" < "$SINCE" ]]; then
              events=$(gh api --paginate --slurp "repos/$REPO/issues/$pr/timeline?per_page=100")
              changed=$(jq --arg since "$SINCE" 'any(.[][]; (.event == "base_ref_changed" or .event == "reopened") and .created_at >= $since)' <<< "$events")
              [[ "$changed" == true ]] || continue
            fi
            current=$(gh api "repos/$REPO/pulls/$pr" --jq '[.state, .base.ref] | join("/")')
            [[ "$current" == "open/python-archive" ]] || continue
            gh api --method PATCH "repos/$REPO/pulls/$pr" -f state=closed --silent
            echo "Closed archive PR #$pr"
          done
