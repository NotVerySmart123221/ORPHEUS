name: Public source checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-tests:
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      ORPHEUS_RUNTIME_DIR: ""
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.12"
          architecture: x64
          cache: pip
      - uses: actions/setup-node@v6.3.0
        with:
          node-version: "24"
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt ruff==0.17.3
      - name: Check Python lint
        run: python -B -m ruff check . --no-cache
      - name: Run Python tests with synthetic fixtures
        shell: pwsh
        run: |
          $patterns = @(
            'test_cli.py',
            'test_launcher.py',
            'test_game_commands.py',
            'test_game_link.py',
            'test_game_ult_charge.py',
            'test_collision_ray.py',
            'test_collision_ray_cache.py',
            'test_static_ray_round.py',
            'test_collision_prop_catalog.py',
            'test_prop_entity_model_refs.py',
            'test_replay_values.py',
            'test_casc_bundle.py',
            'test_script_expr_budget.py',
            'test_script_membership.py',
            'test_script_raycast.py',
            'test_extract_game_graphs.py',
            'test_extract_raycast_metadata.py'
          )
          foreach ($pattern in $patterns) {
            python -B -m unittest discover -s tests -p $pattern
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Run dashboard JavaScript tests
        run: node --test tests/test_dashboard_client.mjs
