[workspace]
members = ["rust/crates/collision"]
default-members = ["."]
resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
publish = false

[package]
name = "orpheus"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Server reimplementation for Overwatch 1.74"

[lib]
path = "rust/src/lib.rs"

[[bin]]
name = "prepare_server_runtime"
path = "rust/src/bin/prepare_server_runtime.rs"

[[bin]]
name = "orpheus_server"
path = "rust/src/bin/orpheus_server.rs"

[[test]]
name = "runtime_preflight"
path = "rust/tests/runtime_preflight.rs"

[dependencies]
aes-gcm = { version = "0.10.3", default-features = false, features = ["aes", "alloc"] }
bevy_ecs = { version = "0.16.1", default-features = false, features = ["std"] }
crc32fast = "1"
flate2 = "1.1"
getrandom = "0.3"
hmac = "0.12"
httparse = "1"
indexmap = { version = "2", features = ["serde"] }
mio = { version = "1.1.1", features = ["net", "os-poll"] }
mlua = { version = "=0.11.6", default-features = false, features = ["lua54", "vendored"] }
orpheus-collision = { path = "rust/crates/collision" }
prost = "0.14"
prost-reflect = "0.16"
roxmltree = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
tungstenite = { version = "0.28", default-features = false, features = ["handshake"] }
