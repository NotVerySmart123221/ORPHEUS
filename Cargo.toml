[package]
name = "orpheus"
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
publish = false
description = "Server reimplementation for Overwatch 1.74"

[lib]
path = "rust/src/lib.rs"

[[bin]]
name = "prepare_server_runtime"
path = "rust/src/bin/prepare_server_runtime.rs"

[[bin]]
name = "orpheus_server"
path = "rust/src/bin/orpheus_server.rs"

[dependencies]
aes-gcm = { version = "0.10.3", default-features = false, features = ["aes", "alloc"] }
crc32fast = "1"
flate2 = "1.1"
getrandom = "0.3"
hmac = "0.12"
httparse = "1"
indexmap = { version = "2", features = ["serde"] }
lzma-rust2 = { version = "0.25", default-features = false, features = ["std", "xz"] }
mio = { version = "1.1.1", features = ["net", "os-poll"] }
prost = "0.14"
prost-reflect = "0.16"
roxmltree = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
tungstenite = { version = "0.28", default-features = false, features = ["handshake"] }
